<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Furniture Swiper</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css"/>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.css" integrity="sha512-kJlvECunwXftkPwyvHbclArO8wszgBGisiLeuDFwNM8ws+wKIw0sv1os3ClWZOcrEB2eRXULYUsm8OVRGJKwGA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script defer src="script.js"></script>
</head>
</head>
<body>
    <div class="main-area">
        <div class="side-bar">
            <a href="#" class="logo">
                <img src="image/furniture-logo.png" alt="">
            </a>
            <div class="social-icons">
                <a href="#" class="icon"><i class="fa-brands fa-facebook-f"></i></a>
                <a href="#" class="icon"><i class="fa-brands fa-twitter"></i></a>
                <a href="#" class="icon"><i class="fa-brands fa-linkedin-in"></i></a>
                <a href="#" class="icon"><i class="fa-brands fa-instagram"></i></a>
            </div>
        </div>
        <div class="working-area">
            <nav class="navbar">
                <ul class="navlist">
                    <li>
                        <a href="#" class="navlinks">Projects</a>
                    </li>
                    <li>
                        <a href="#" class="navlinks">About Us</a>
                    </li>
                    <li>
                        <a href="#" class="navlinks">Regions</a>
                    </li>
                    <li>
                        <a href="#" class="navlinks">Designs</a>
                    </li>
                </ul>
                <div class="action">
                    <a href="#">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </a>
                    <a href="#">
                        <i class="fa-solid fa-user"></i>
                    </a>
                    <a href="#">
                        <i class="fa-solid fa-bag-shopping"></i>
                    </a>
                </div>
            </nav>
            <section class="hero-section">
                <div class="content">
                    <h1>Furniture You Will Love</h1>
                    <p>Our mission is to provide quality furnishings
                        and accessories from trusted name brands manufactures.</p>
                        <button>Add to Cart</button>
                        <ul class="navlist detail">
                            <li>
                                <h3>Size</h3>
                                <span>85 x 70 x 80</span>
                            </li>
                            <li>
                                <h3>Materials</h3>
                                <span>Fabric Foam, Steal</span>
                            </li>
                            <li>
                                <h3>Shipping</h3>
                                <span>Europe, Asia</span>
                            </li>
                        </ul>
                </div>
                <div class="swiper mySwiper">
    <div class="swiper-wrapper">
        <div class="swiper-slide">
            <img src="image/armchair1.png" alt="">
        </div>
        <div class="swiper-slide">
            <img src="image/armchair2.png" alt="">
        </div>
        <div class="swiper-slide">
            <img src="image/armchair3.png" alt="">
        </div>
        <div class="swiper-slide">
            <img src="image/armchair4.png" alt="">
        </div>
        <div class="swiper-slide">
            <img src="image/armchair5.png" alt="">
        </div>
    </div>
    <a href="#" class="play">
        <i class="fa-solid fa-play"></i>
    </a>
    </div>
    <div class="controls">
        <i class="fa-solid fa-angle-right next"></i>
        <i class="fa-solid fa-angle-left prev"></i>
    </div>
            </section>
        </div>
    </div>
    <script src="js/main.js"></script>
</body>
</html>
