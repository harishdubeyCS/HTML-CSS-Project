<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snapples</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.css" integrity="sha512-kJlvECunwXftkPwyvHbclArO8wszgBGisiLeuDFwNM8ws+wKIw0sv1os3ClWZOcrEB2eRXULYUsm8OVRGJKwGA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

<body>
    <div class="web-container">
        <header>

                <div class="logo">Snapple</div>

                <ul class="navlist">
                    <li><a href="#"></a>Home</li>
                    <li><a href="#"></a>About</li>
                    <li><a href="#"></a>Flavour</li>
                    <li><a href="#"></a>Order</li>
                    <li><a href="#"></a>Contact</li>
                </ul>
            </nav>
        </header>
        <section class="hero-section">
            <div class="content">
                <h1>Apple</h1>
                <div class="bottom-content">
                    <button>Show Flavours</button>
                    <p><span>Our Flavours</span> are the best your healthy life start with us.</p>

            </div>
            <div class="image-container">

        </section>
        <ul class="social-icons">
            <li>
                <a href="#" class="icon"><i class="ri-facebook-fill"></i></a>
            </li>
            <li>
                <a href="#" class="icon"><i class="ri-twitter-fill"></i></a>
            </li>
            <li>
                <a href="#" class="icon"><i class="ri-instagram-fill"></i></a>
            </li>
            <li>
